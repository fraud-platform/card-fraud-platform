# Secrets Ownership (Doppler)
# Owned by: card-fraud-platform
# Format: YAML
---
projects:
  card-fraud-platform:
    owner: platform
    type: platform
    purpose: Shared runtime secrets for suite mode
    secrets:
      - POSTGRES_ADMIN_PASSWORD
      - FRAUD_GOV_APP_PASSWORD
      - FRAUD_GOV_ANALYTICS_PASSWORD
      - FRAUD_GOV_MCP_READER_PASSWORD
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_BUCKET_NAME
      - S3_REGION
      - FRAUD_GOV_MCP_S3_ACCESS_KEY
      - FRAUD_GOV_MCP_S3_SECRET_KEY
      - AUTH0_DOMAIN
      - AUTH0_USER_AUDIENCE
      - REDIS_URL
      - KAFKA_BOOTSTRAP_SERVERS
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - SECURITY_CORS_ALLOWED_ORIGINS

  card-fraud-rule-management:
    owner: rule-management
    type: service
    purpose: Standalone config + service-specific values
    secrets:
      - RULE_MGMT_AUTH0_AUDIENCE
      - AUTH0_TEST_CLIENT_ID
      - AUTH0_TEST_CLIENT_SECRET
      - TEST_USER_PLATFORM_ADMIN_PASSWORD
      - TEST_USER_RULE_MAKER_PASSWORD
      - TEST_USER_RULE_CHECKER_PASSWORD
      - TEST_USER_FRAUD_ANALYST_PASSWORD
      - TEST_USER_FRAUD_SUPERVISOR_PASSWORD
      - APP_ENV

  card-fraud-rule-engine-auth:
    owner: rule-engine
    type: service
    purpose: Standalone config + AUTH runtime values
    secrets:
      - RULE_ENGINE_AUTH0_AUDIENCE
      - RULE_ENGINE_AUTH0_CLIENT_ID
      - RULE_ENGINE_AUTH0_CLIENT_SECRET
      - QUARKUS_PROFILE

  card-fraud-rule-engine-monitoring:
    owner: rule-engine
    type: service
    purpose: Standalone config + MONITORING runtime values
    secrets:
      - RULE_ENGINE_AUTH0_AUDIENCE
      - RULE_ENGINE_AUTH0_CLIENT_ID
      - RULE_ENGINE_AUTH0_CLIENT_SECRET
      - QUARKUS_PROFILE

  card-fraud-transaction-management:
    owner: transaction-management
    type: service
    purpose: Standalone config + messaging values
    secrets:
      - TXN_MGMT_AUTH0_AUDIENCE
      - KAFKA_CONSUMER_GROUP_ID
      - KAFKA_DLQ_TOPIC

  card-fraud-intelligence-portal:
    owner: intelligence-portal
    type: service
    purpose: Standalone config + SPA values
    secrets:
      - VITE_AUTH0_DOMAIN
      - VITE_AUTH0_CLIENT_ID
      - VITE_AUTH0_AUDIENCE
      - E2E_AUTH0_CLIENT_ID
      - E2E_AUTH0_CLIENT_SECRET
      - VITE_API_URL

  card-fraud-ops-analyst-agent:
    owner: ops-analyst-agent
    type: service
    purpose: Service config + LLM/provider values
    secrets:
      - OPS_ANALYST_AUTH0_AUDIENCE
      - OPS_ANALYST_AUTH0_CLIENT_ID
      - OPS_ANALYST_AUTH0_CLIENT_SECRET
      - LLM_PROVIDER
      - LLM_API_KEY
      - LLM_BASE_URL
      - LLM_TIMEOUT
      - LLM_MAX_RETRIES
      - LLM_PROMPT_GUARD_ENABLED
      - LLM_MAX_PROMPT_TOKENS
      - LLM_MAX_COMPLETION_TOKENS
      - LLM_CONSISTENCY_THRESHOLD
      - LLM_STAGE_TIMEOUT_SECONDS
      - LLM_ROUTINE_MODEL
      - LLM_ESCALATION_MODEL
      - LLM_REASONING_EFFORT
      - PLANNER_MODEL_NAME
      - PLANNER_LLM_ENABLED
      - PLANNER_TEMPERATURE
      - PLANNER_MAX_TOKENS
      - PLANNER_TIMEOUT_SECONDS
      - PLANNER_EVIDENCE_SELECTION_ENABLED
      - LANGGRAPH_INVESTIGATION_TIMEOUT_SECONDS
      - LANGGRAPH_TOOL_TIMEOUT_SECONDS
      - LANGGRAPH_PLANNER_TIMEOUT_SECONDS
      - VECTOR_ENABLED
      - VECTOR_API_BASE
      - VECTOR_API_KEY
      - VECTOR_MODEL_NAME
      - VECTOR_DIMENSION
      - VECTOR_SEARCH_LIMIT
      - VECTOR_TIME_WINDOW_DAYS
      - VECTOR_MIN_SIMILARITY
      - VECTOR_REQUEST_TIMEOUT_S
      - VECTOR_RETRY_ATTEMPTS
      - VECTOR_RETRY_BACKOFF_SECONDS

configs:
  - local
  - test
  - prod
